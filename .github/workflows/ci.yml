name: CI

# Checks and tests only. ZIP packages are built by the Release workflow.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Syntax, imports, manifest, locales, translation coverage and a packaging dry run
      - name: Static checks
        run: npm run check

      - name: Unit tests
        run: npm test

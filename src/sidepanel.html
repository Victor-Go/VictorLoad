<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VictorLoad</title>
    <link rel="icon" type="image/png" href="../icons/icon32.png" />
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <!-- ============ Main view ============ -->
    <section id="viewMain" class="view">
      <header class="top">
        <div class="avatar" id="avatar">V</div>
        <div class="site">
          <div class="host" id="host">VictorLoad</div>
          <div class="sum" id="sum">正在嗅探…</div>
        </div>
        <button id="btnRefresh" class="icon" title="重新嗅探当前页面" aria-label="重新嗅探">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        </button>
        <button id="btnHistory" class="icon" title="下载记录" aria-label="下载记录">
          <svg viewBox="0 0 24 24"><path d="M12 7v5l3 2"/><path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.7"/><path d="M4 4v4.7h4.7"/></svg>
        </button>
        <button id="btnSettings" class="icon" title="过滤与设置" aria-label="设置">
          <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        </button>
      </header>

      <div class="switch">
        <button class="tab" data-tab="video">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg>
          视频 <b id="cntVideo">0</b><i class="dot"></i>
        </button>
        <button class="tab" data-tab="image">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>
          图片 <b id="cntImage">0</b><i class="dot"></i>
        </button>
      </div>

      <div class="toolbar">
        <div class="chips">
          <button class="chip" data-mode="main">主要 <b id="cntMain">0</b></button>
          <button class="chip" data-mode="all">全部 <b id="cntAll">0</b></button>
        </div>
        <label class="selall"><input type="checkbox" id="selAll" /><span>全选</span></label>
      </div>

      <div id="notice" class="notice hidden"></div>
      <main id="list" class="list"></main>
      <div id="empty" class="empty hidden"></div>

      <footer class="dock">
        <button id="dlAll" class="btn ghost">全部下载 (0)</button>
        <button id="dlSel" class="btn primary">下载选中 (0)</button>
      </footer>
    </section>

    <!-- ============ History ============ -->
    <section id="viewHistory" class="view hidden">
      <header class="sub">
        <button class="back" data-back aria-label="返回">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <h2>下载记录</h2>
        <button id="histClear" class="link danger">清空</button>
      </header>
      <div class="sub-body">
        <div id="histNotice" class="notice warn hidden">
          <span class="txt"></span>
          <button id="histNoticeOk" class="link">知道了</button>
        </div>
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input id="histSearch" type="search" placeholder="搜索标题、站点或清晰度" />
        </div>
        <label class="switchrow">
          <span>
            <b>页面上显示绿色对勾</b>
            <em>已下载的图片和视频右下角会出现绿色小对勾</em>
          </span>
          <input type="checkbox" id="optBadge" class="toggle" />
        </label>
        <div id="histList" class="hist-list"></div>
      </div>
    </section>

    <!-- ============ Settings ============ -->
    <section id="viewSettings" class="view hidden">
      <header class="sub">
        <button class="back" data-back aria-label="返回">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <h2>过滤与设置</h2>
        <button id="resetSettings" class="link">恢复默认</button>
      </header>
      <div class="sub-body">
        <section class="group">
          <h3>语言 / Language</h3>
          <select data-s="uiLang" data-dd aria-label="语言 / Language">
            <option value="auto">自动</option>
            <option value="zh">简体中文</option>
            <option value="zh-TW">繁體中文</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
          </select>
        </section>

        <section class="group">
          <h3>显示方式</h3>
          <div class="pick">
            <label><input type="radio" name="uiMode" value="sidepanel" data-s="uiMode" /><span>侧边栏</span></label>
            <label><input type="radio" name="uiMode" value="popup" data-s="uiMode" /><span>浮窗</span></label>
          </div>
          <p class="hint pad">侧边栏会一直停靠并实时更新；浮窗点击图标弹出，点到别处会自动关闭。切换后立即生效。</p>
        </section>

        <p class="hint">下面的标准决定「主要」列表里显示什么，其余内容仍可在「全部」中找到。</p>

        <section class="group">
          <h3>主要图片</h3>
          <label class="field"><span>最小宽度</span><span class="inp"><input type="number" min="0" data-s="imgMinW" /><em>px</em></span></label>
          <label class="field"><span>最小高度</span><span class="inp"><input type="number" min="0" data-s="imgMinH" /><em>px</em></span></label>
          <label class="field"><span>最小体积</span><span class="inp"><input type="number" min="0" data-s="imgMinKB" /><em>KB</em></span></label>
        </section>

        <section class="group">
          <h3>主要视频</h3>
          <label class="field"><span>最小宽度</span><span class="inp"><input type="number" min="0" data-s="vidMinW" /><em>px</em></span></label>
          <label class="field"><span>最小高度</span><span class="inp"><input type="number" min="0" data-s="vidMinH" /><em>px</em></span></label>
          <label class="field"><span>最短时长</span><span class="inp"><input type="number" min="0" data-s="vidMinDur" /><em>秒</em></span></label>
          <label class="field"><span>最小体积</span><span class="inp"><input type="number" min="0" data-s="vidMinMB" /><em>MB</em></span></label>
        </section>

        <section class="group">
          <h3>文件名格式</h3>
          <div class="namebox">
            <div class="presets">
              <button class="chip2" data-preset="{tab}">标签页名</button>
              <button class="chip2" data-preset="{name}">文件本身的名字</button>
              <button class="chip2" data-preset="{tab} [{resolution}]">标签页名 + 分辨率</button>
            </div>
            <input id="nameFormat" class="textinp" type="text" data-s="nameFormat" spellcheck="false" placeholder="{tab}" />
            <div class="presets">
              <span class="hint">插入：</span>
              <button class="chip2 mono" data-token="{tab}">{tab}</button>
              <button class="chip2 mono" data-token="{name}">{name}</button>
              <button class="chip2 mono" data-token="{duration}">{duration}</button>
              <button class="chip2 mono" data-token="{resolution}">{resolution}</button>
            </div>
            <p class="hint">
              {tab} 标签页名 · {name} 视频/图片本身的名字 · {duration} 时长（如 5m32s） · {resolution} 分辨率（视频如 1080p，图片如 1920x1080）。同名文件会自动加序号。
            </p>
            <div class="example"><span>示例</span><code id="namePreview"></code></div>
          </div>
        </section>

        <section class="group">
          <h3>下载</h3>
          <label class="switchrow">
            <span><b>记住我选的内容</b><em>点「下载选中」后，下次会在这个网站的「主要」列表中显示并勾选同类内容</em></span>
            <input type="checkbox" class="toggle" data-s="autoRemember" />
          </label>
          <label class="switchrow">
            <span><b>按站点分文件夹</b><em>保存到 下载/VictorLoad/站点名/</em></span>
            <input type="checkbox" class="toggle" data-s="subfolder" />
          </label>
          <label class="switchrow">
            <span><b>YouTube 优先 H.264</b><em>可把缓冲的音视频合并成单个 mp4，最高 1080p。修改后刷新 YouTube 页面生效</em></span>
            <input type="checkbox" class="toggle" data-s="ytH264" />
          </label>
          <label class="field"><span>默认分辨率不超过</span><span class="inp"><input type="number" min="0" data-s="prefHeight" /><em>p</em></span></label>
        </section>

        <section class="group">
          <h3>已记住的内容类型</h3>
          <div id="remList" class="rem-list"></div>
        </section>
      </div>
    </section>

    <div id="toasts" class="toasts"></div>

    <script src="../vendor/hls.min.js"></script>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
